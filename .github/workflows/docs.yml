name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment, and let a newer push cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.mkdocs.outputs.present }}
      # GitHub Pages is a repository setting, not a file: until the maintainer enables it
      # (Settings -> Pages -> Source: GitHub Actions) the deploy cannot run. The site is
      # still built strictly and uploaded as a workflow artifact, so the build stays
      # verified and the failure mode is a skipped deploy instead of a red workflow.
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v7

      # The documentation site is optional while `mkdocs.yml` does not exist, so
      # the whole job is skipped rather than failed.
      - name: check for mkdocs.yml
        id: mkdocs
        run: |
          if [ -f mkdocs.yml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "mkdocs.yml is not present; skipping the documentation build."
          fi

      - name: install mkdocs-material
        if: steps.mkdocs.outputs.present == 'true'
        run: python -m pip install --upgrade mkdocs-material

      - name: build the site
        if: steps.mkdocs.outputs.present == 'true'
        run: mkdocs build --strict

      - name: upload the built site as a workflow artifact
        if: steps.mkdocs.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

      - name: configure GitHub Pages
        id: pages
        if: steps.mkdocs.outputs.present == 'true'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: upload the Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    # Nothing to deploy when `mkdocs.yml` is absent or Pages is not enabled yet.
    if: needs.build.outputs.present == 'true' && needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
