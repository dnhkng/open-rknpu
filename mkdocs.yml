# Minimal mkdocs-material configuration for the open-rknpu documentation.
#
# Build locally with:
#   python -m pip install mkdocs-material
#   mkdocs serve            # http://127.0.0.1:8000
#
# The site is deployed by .github/workflows/docs.yml on pushes to `main`.

site_name: open-rknpu
site_description: An open compiler and libc-only runtime for the Rockchip RV1103/RV1106 NPU.
site_author: open-rknpu contributors

# Placeholder: replace with the real Pages URL before the first deployment.
site_url: https://dnhkng.github.io/open-rknpu/

repo_name: dnhkng/open-rknpu
repo_url: https://github.com/dnhkng/open-rknpu
edit_uri: edit/main/docs/

docs_dir: docs

# The documentation deliberately links *outside* docs_dir: the pages point at the
# evidence tree (`../research/**/README.md`), the examples and the repository files, which
# is what a reader on GitHub wants. MkDocs cannot resolve those targets because it only
# builds `docs/`, so link resolution is not treated as fatal here. Link integrity is not
# unchecked: `research/check_docs_links.py` walks every markdown file in the repository
# (including docs/) and fails on a broken relative link or a missing heading anchor, and it
# runs in CI and in `make docs-check`. See docs/verification.md.
validation:
  absolute_links: ignore
  unrecognized_links: ignore
  links:
    not_found: ignore
    anchors: ignore

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: README.md
  - Guides:
      - Getting Started: getting-started.md
      - Support Matrix: support-matrix.md
      - Troubleshooting: troubleshooting.md
      - Primitives: primitives.md
      - Glossary: glossary.md
  - Compiler:
      - Architecture: architecture.md
      - Quantization: quantization.md
      - Calibration Cookbook: calibration-cookbook.md
      - Registers: registers.md
      - Errors: errors.md
      - Api: api.md
      - Api Stability: api-stability.md
      - Verification: verification.md
      - Mutation Testing: mutation-testing.md
      - Roadmap: roadmap.md
      - Performance: performance.md
  - Runtime and board:
      - Container Format: container-format.md
      - Container Migration: container-migration.md
      - Container Example: container-example.md
      - C Api: c-api.md
      - Board: board.md
      - Board Quickstart: board-quickstart.md
      - Board Access: board-access.md
      - Board Runbook: board-runbook.md
  - Project records:
      - Investigation Log: investigation-log.md
      - Provenance: provenance.md
      - Evidence Storage: evidence-storage.md
      - Branch Protection: branch-protection.md
      - Publish Checklist: publish-checklist.md
      - Plans:
          - Readme: plans/README.md
          - Cleanup Plan: plans/cleanup-plan.md
          - Completion Plan: plans/completion-plan.md
          - Coverage Matrix: plans/coverage-matrix.md
          - Milestone Record: plans/milestone-record.md
          - Pipelining Plan: plans/pipelining-plan.md
          - Primitive Roadmap: plans/primitive-roadmap.md
          - Project Goals: plans/project-goals.md
