[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "open-rknpu"
version = "0.1.0"
description = "Open compiler and libc-only runtime for the Rockchip RV1103/RV1106 NPU"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "onnx"]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["rockchip", "rv1103", "rv1106", "npu", "onnx", "compiler", "edge-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: C",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Compilers",
]

# Developed by "open-rknpu contributors"; the maintainer of the 0.1.0 release is
# listed here and in AUTHORS.
authors = [{ name = "open-rknpu contributors" }, { name = "dnhkng" }]
maintainers = [{ name = "dnhkng" }]

[project.urls]
Homepage = "https://github.com/dnhkng/open-rknpu"
Repository = "https://github.com/dnhkng/open-rknpu"
Documentation = "https://github.com/dnhkng/open-rknpu/tree/main/docs"
Issues = "https://github.com/dnhkng/open-rknpu/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff", "build", "coverage", "twine", "pre-commit", "mkdocs-material"]

[project.scripts]
open-rknpu = "open_rknpu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the libc-only board runtime sources with the distribution so a user can
# build the RV1103 runtime without a source checkout. The wheel is the compiler;
# the runtime is cross-compiled for the board with the vendor toolchain.
[tool.setuptools.data-files]
"share/open-rknpu/runtime" = ["runtime/open_rknpu.c", "runtime/open_rknpu.h", "runtime/main.c", "runtime/Makefile", "runtime/sequence_format.md"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/open_rknpu"]
branch = false

[tool.coverage.report]
skip_covered = true
show_missing = false
# Host line coverage of the compiler. Ratchet: the measured value is 98% (873 tests,
# 2026-09-11; the ten uncovered lines are documented defensive/dead guards in
# tests/test_emitter_fuzz.py and docs/verification.md). Raise it whenever the measured
# value moves up (`make coverage`).
fail_under = 97
